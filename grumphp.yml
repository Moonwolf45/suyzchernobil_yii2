grumphp:
    hooks_dir: ~
    hooks_preset: local
    git_hook_variables: { }
    stop_on_failure: true # Остановит проверку сразу на первом упавшем инструменте
    tasks:
        # 1. Проверка стиля кода (только измененные файлы)
        phpcsfixer:
            config: .php-cs-fixer.dist.php
            triggered_by: [ 'php' ]

        # 2. Контроль архитектуры layers
        deptrac:
            depfile: deptrac.yaml

        # 3. Ваш текущий PHPStan
        phpstan:
            configuration: phpstan.neon
            level: 5
            use_grumphp_paths: false    # Заставляет GrumPHP использовать пути и правила строго из phpstan.neon
            triggered_by: [ 'php' ]