# GitHub Actions CI/CD для Yii2 проекта
# Без тестов - только линтинг, сборка и деплой

name: Yii2 Deploy

on:
  push:
    branches: [ main, master ]
  # Ручной запуск
  workflow_dispatch:

env:
  PHP_VERSION: '8.3'
  COMPOSER_VERSION: '2'

jobs:
  # ============================================
  # СТАДИЯ ПРОГРАММНЫХ ПРОВЕРОК (CI)
  # ============================================
  lint_and_test:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, gd, curl, imagick, pdo_mysql, exif
          tools: composer:v${{ env.COMPOSER_VERSION }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress

      - name: 1. Проверка синтаксиса PHP (lint)
        run: |
          echo "Проверка синтаксиса PHP файлов..."
          find . -name "*.php" -not -path "./vendor/*" -not -path "./runtime/*" -not -path "./web/assets/*" | xargs -n1 -P4 php -l

      - name: 2. Проверка стиля кода (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: 3. Контроль архитектуры (Deptrac)
        run: vendor/bin/deptrac

      - name: 4. Запуск PHPStan
        run: vendor/bin/phpstan analyse --level=5

      - name: 5. Запуск Psalm
        run: vendor/bin/psalm --no-progress

  # ============================================
  # СБОРКА И ДЕПЛОЙ (CD)
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: lint_and_test # Запускается ТОЛЬКО если lint_and_test завершился успешно

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, gd, curl, imagick, pdo_mysql, exif
          tools: composer:v${{ env.COMPOSER_VERSION }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Используем production-оптимизации, отключая dev-зависимости для сервера
      - name: Install production dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Настройка прав доступа
        run: |
          mkdir -p runtime runtime/logs runtime/cache
          chmod -R 0777 runtime
          chmod -R 0777 web/assets

      - name: Очистка кеша
        run: |
          rm -rf runtime/cache/*
          rm -rf web/assets/*

      - name: Deploy via SSH/rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzt --no-times --no-perms --no-owner --no-group --exclude='.git/' --exclude='tests/' --exclude='docs/' --exclude='vagrant/' --exclude='.env.example' --exclude='.github/' --exclude='runtime/cache/' --exclude='runtime/logs/' --exclude='web/assets/' --exclude='.env'
          path: ./
          remote_path: ${{ secrets.SERVER_PATH }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SERVER_PORT }}
          remote_path_is_relative: false

      - name: Run Yii2 Migrations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            /usr/local/bin/php8.3 yii migrate --interactive=0

      # ============================================
      # Уведомление в Telegram
      # ============================================
      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Деплой успешен!%0A📦 Commit: ${{ github.sha }}%0A👤 Автор: ${{ github.actor }}%0A🔗 https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          else
            MESSAGE="❌ Деплой провалился!%0A📦 Commit: ${{ github.sha }}%0A👤 Автор: ${{ github.actor }}%0A🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$MESSAGE&parse_mode=html"
        continue-on-error: true